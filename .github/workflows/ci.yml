name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c requirements.lock.txt -r requirements-dev.txt

      - name: Unit and integration tests
        run: python -m pytest -q

      - name: Scenario engine demo
        run: python -m examples.ordcast_demo > /tmp/ordcast-demo.json

      - name: Persistence baseline smoke test
        run: >-
          python -m pipelines.nowcast.persistence_nowcast
          --demo
          --out /tmp/nowcast_60min.nc

      - name: API health smoke test
        run: |
          uvicorn serve.api_fastapi:app --host 127.0.0.1 --port 8000 >/tmp/api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8000/health >/tmp/health.json; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/api.log
          exit 1

  container:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f ops/docker/Dockerfile.api -t ordcast/api:ci .

  windows-local:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c requirements.lock.txt -r requirements-dev.txt
      - name: Parse local PowerShell scripts
        shell: pwsh
        run: |
          $allErrors = @()
          Get-ChildItem ops/windows/*.ps1 | ForEach-Object {
            $tokens = $null
            $fileErrors = $null
            [void][Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$fileErrors
            )
            $allErrors += $fileErrors
          }
          if ($allErrors.Count -gt 0) {
            $allErrors | Format-List | Out-String | Write-Error
          }
      - name: Windows archive, lock, and local-station tests
        shell: pwsh
        run: >-
          python -m pytest -q
          tests/test_archive.py
          tests/test_local_station.py
          tests/test_accelerator.py
          tests/test_windows_local_station.py
